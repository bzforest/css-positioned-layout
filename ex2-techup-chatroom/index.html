<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <div class="chatroom">
    <header class="chatroom__header">Techup Chatroom</header>

    <section class="chatroom__window">
      <div class="message right">
        <span class="bubble">
          สวัสดีค่า
        </span>
      </div>

      <div class="message right">
        <span class="bubble bubble--reply">
          Coding สนุกจังเลย
        </span>
        <button class="status-dot"> x </button>
      </div>

      <div class="message right">
        <span class="bubble">
          🥰🥳
        </span>
      </div>

      <div class="message left">
        <span class="bubble emoji-only">🥰</span>
      </div>
      <div class="message left">
        <span class="bubble emoji-only">🥳</span>
      </div>
    </section>
  </div>
</body>

</html>
